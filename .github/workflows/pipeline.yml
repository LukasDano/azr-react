name: CI/CD

on:
    push:
        branches:
            - main
    pull_request:

env:
    frontend: .
    node_version: 24

jobs:
    setup:
        runs-on: ubuntu-latest
        outputs:
            cache-hit: ${{ steps.cache.outputs.cache-hit }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - name: Install Dependencies
              run: npm ci
              working-directory: ${{ env.frontend }}

    tsc-check:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - run: npm ci
              working-directory: ${{ env.frontend }}

            - name: TypeScript check
              run: npm run tsc
              working-directory: ${{ env.frontend }}

    oxfmt-check:
        runs-on: ubuntu-latest
        needs: [setup, tsc-check]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - run: npm ci
              working-directory: ${{ env.frontend }}

            - run: npx oxfmt --version

            - name: Run oxfmt check
              run: npm run ox:fmt:check
              working-directory: ${{ env.frontend }}

    oxlint-check:
        runs-on: ubuntu-latest
        needs: [setup, oxfmt-check, tsc-check]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - run: npm ci
              working-directory: ${{ env.frontend }}

            - name: Run oxlint
              run: npm run ox:lint:ci
              working-directory: ${{ env.frontend }}

    vitest-function:
        runs-on: ubuntu-latest
        needs: [tsc-check, oxfmt-check, oxlint-check]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - run: npm ci
              working-directory: ${{ env.frontend }}

            - name: Run function tests
              run: npm run vitest:function
              working-directory: ${{ env.frontend }}

    vitest-component:
        runs-on: ubuntu-latest
        needs: [tsc-check, oxfmt-check, oxlint-check]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}
                  cache: npm

            - run: npm ci
              working-directory: ${{ env.frontend }}

            - name: Run component tests
              run: npm run vitest:component
              working-directory: ${{ env.frontend }}
